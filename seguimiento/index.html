<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2f5fb3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Seguimiento">
<title>Seguimiento</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1d2433; --muted:#667085; --line:#e3e8f2;
  --pri:#2f5fb3; --pri-2:#c9daf8; --pri-soft:#eaf1fe;
  --ok:#1f8a5b; --ok-soft:#e6f5ee; --warn:#b26a00; --warn-soft:#fff4e0; --bad:#c2410c; --bad-soft:#fdeee7;
  --r:16px; --shadow:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.05);
  --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
header.top{position:sticky;top:0;z-index:20;background:rgba(244,246,251,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header.top h1{font-size:19px;margin:0;flex:1;font-weight:700;letter-spacing:-.01em}
header.top .back{border:0;background:none;color:var(--pri);font-size:16px;padding:6px 4px;cursor:pointer;font-weight:600}
main{padding:14px 14px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);max-width:760px;margin:0 auto}
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);height:calc(var(--nav-h) + env(safe-area-inset-bottom))}
nav.bottom button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer;font-weight:600}
nav.bottom button svg{width:24px;height:24px}
nav.bottom button.on{color:var(--pri)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.card h2{font-size:16px;margin:0 0 10px;font-weight:700}
.card h3{font-size:14px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.muted{color:var(--muted)} .small{font-size:13.5px}
.hero{background:linear-gradient(135deg,#2f5fb3,#4f7fd1);color:#fff;border:0}
.hero .muted{color:#dce6fb}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:650;cursor:pointer;background:var(--pri);color:#fff;min-height:48px;text-decoration:none}
.btn.sec{background:var(--pri-soft);color:var(--pri)}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14px;border-radius:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid2>*,.grid3>*{min-width:0}
.stack>*+*{margin-top:10px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.quick button{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:16px 12px;text-align:left;cursor:pointer;box-shadow:var(--shadow);font-size:15px;font-weight:650;color:var(--ink);min-height:84px}
.quick button span{display:block;font-size:24px;margin-bottom:4px}
.quick button.main{grid-column:1/-1;background:var(--pri);color:#fff;border:0;display:flex;align-items:center;gap:12px}
.quick button.main span{margin:0}
.stat{background:var(--pri-soft);border-radius:12px;padding:12px}
.stat b{display:block;font-size:24px;line-height:1.1;color:var(--pri)}
.stat small{color:var(--muted);font-size:12.5px}
label.f{display:block;font-weight:650;font-size:14.5px;margin:14px 0 6px}
label.f .hint{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:1px}
input[type=text],input[type=date],input[type=time],input[type=number],textarea,select{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid #cfd6e4;border-radius:12px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
input[type=date],input[type=time]{min-height:48px;min-width:0;max-width:100%;padding:12px 8px}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--pri-2);border-color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #cfd6e4;background:#fff;border-radius:999px;padding:8px 13px;font-size:14.5px;cursor:pointer;user-select:none;color:var(--ink);line-height:1.2}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.scale{display:flex;gap:6px}
.scale button{flex:1;border:1px solid #cfd6e4;background:#fff;border-radius:12px;padding:10px 0;font-size:16px;font-weight:700;cursor:pointer;color:var(--ink);min-height:46px}
.scale button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.scale-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.section-title{display:flex;align-items:center;gap:8px;margin:18px 0 4px;font-size:13px;font-weight:800;color:var(--pri);text-transform:uppercase;letter-spacing:.05em}
.section-title .n{background:var(--pri);color:#fff;border-radius:999px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.item{display:block;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item .t{font-weight:650}
.item .s{color:var(--muted);font-size:13.5px;margin-top:2px}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--pri-soft);color:var(--pri);margin:2px 4px 2px 0}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:999px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.notice{background:var(--warn-soft);color:#7a4a00;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.notice.info{background:var(--pri-soft);color:#1f3f7a}
.sticky-actions{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px);display:flex;gap:10px;margin-top:18px;z-index:5}
.sticky-actions .btn{flex:1;box-shadow:0 4px 16px rgba(47,95,179,.25)}
.paq-item{padding:14px 0;border-bottom:1px solid var(--line)}
.paq-item p{margin:0 0 8px;font-weight:600}
.paq-item p .num{color:var(--pri);margin-right:6px}
details.guide{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;box-shadow:var(--shadow)}
details.guide summary{padding:14px 16px;font-weight:700;cursor:pointer;list-style:none}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary::after{content:"＋";float:right;color:var(--pri)}
details.guide[open] summary::after{content:"－"}
details.guide .body{padding:0 16px 14px}
details.guide .body p,details.guide .body li{font-size:15px}
.toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);background:#1d2433;color:#fff;padding:12px 16px;border-radius:12px;font-size:14.5px;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.2);max-width:90vw;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.chart svg{width:100%;height:auto;display:block}
.levels{display:flex;gap:4px;margin-top:6px}
.levels i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.levels i.on{background:var(--ok)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.detail p{margin:6px 0 12px;white-space:pre-wrap}
.detail .lbl{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--pri)}
.seg{display:flex;background:var(--pri-soft);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:700;font-size:14px;color:var(--pri);cursor:pointer}
.seg button.on{background:#fff;box-shadow:var(--shadow)}
@media (min-width:700px){ .quick{grid-template-columns:repeat(4,1fr)} .quick button.main{grid-column:span 2} }
</style>
</head>
<body>
<header class="top"><button class="back" id="btnBack" hidden>‹ Atrás</button><h1 id="title">Seguimiento</h1></header>
<main id="app"></main>
<nav class="bottom" id="nav">
  <button data-tab="inicio" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
  <button data-tab="conductas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Registro</button>
  <button data-tab="diario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>Diario</button>
  <button data-tab="terapias"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>Terapias</button>
  <button data-tab="mas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Más</button>
</nav>
<div class="toast" id="toast"></div>
<script src="vendor/jszip.min.js?v=1.5"></script>
<script src="export.js?v=1.5"></script>
<script src="app.js?v=1.5"></script>
</body>
</html>
