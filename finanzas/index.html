<!doctype html>
<html lang="es">
<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f3d2e'/%3E%3Cpath d='M18 42V22m14 20V28m14 14V16' stroke='%23b8f2d0' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f6f3; --surface:#ffffff; --surface-2:#eef2ee; --text:#14211b; --muted:#5d6b64; --faint:#8b9891;
  --border:#dde4de; --accent:#0f3d2e; --accent-2:#1f7a55; --accent-soft:#dff3e7;
  --pos:#1a7f4b; --neg:#c0392b; --warn:#b7791f; --info:#2b6cb0;
  --pos-soft:#e3f5ea; --neg-soft:#fbe9e7; --warn-soft:#fdf3df; --info-soft:#e7f0fb;
  --c1:#1f7a55; --c2:#2b6cb0; --c3:#b7791f; --c4:#8e44ad; --c5:#c0392b; --c6:#16a085; --c7:#7f8c8d;
  --shadow:0 1px 2px rgba(16,32,24,.06),0 4px 14px rgba(16,32,24,.05);
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1210; --surface:#141c18; --surface-2:#1b2520; --text:#e6eee9; --muted:#9db0a6; --faint:#6f8279;
  --border:#26332d; --accent:#9fe3bf; --accent-2:#5cc28f; --accent-soft:#183026;
  --pos:#5cc28f; --neg:#ff7b6b; --warn:#f0b955; --info:#7fb2ef;
  --pos-soft:#15301f; --neg-soft:#3a1d19; --warn-soft:#33281a; --info-soft:#18273a;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#0c1210; --surface:#141c18; --surface-2:#1b2520; --text:#e6eee9; --muted:#9db0a6; --faint:#6f8279;
  --border:#26332d; --accent:#9fe3bf; --accent-2:#5cc28f; --accent-soft:#183026;
  --pos:#5cc28f; --neg:#ff7b6b; --warn:#f0b955; --info:#7fb2ef;
  --pos-soft:#15301f; --neg-soft:#3a1d19; --warn-soft:#33281a; --info-soft:#18273a;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-2)}
.app{max-width:1100px;margin:0 auto;padding:0 16px calc(92px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);
  display:flex;align-items:center;gap:10px;padding:12px 16px;margin:0 -16px 8px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.brand .logo svg{width:18px;height:18px}
.top .sp{flex:1}
.upd{font-size:12px;color:var(--muted);text-align:right;line-height:1.2}
.iconbtn{border:1px solid var(--border);background:var(--surface);border-radius:10px;height:36px;min-width:36px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.iconbtn:hover{background:var(--surface-2)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);
  display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;max-width:120px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0;cursor:pointer;border-radius:10px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent-2);font-weight:600}
@media (min-width:900px){
  .app{padding-bottom:40px}
  nav.tabs{position:sticky;top:61px;bottom:auto;border:0;background:transparent;justify-content:flex-start;gap:4px;margin:0 0 6px;padding:0}
  nav.tabs button{flex:none;flex-direction:row;font-size:14px;gap:8px;padding:8px 14px;max-width:none}
  nav.tabs button svg{width:18px;height:18px}
  nav.tabs button.on{background:var(--accent-soft)}
}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:31;border:0;border-radius:28px;background:var(--accent);color:#fff;
  height:52px;padding:0 18px 0 14px;display:flex;align-items:center;gap:8px;font-weight:600;box-shadow:0 6px 20px rgba(15,61,46,.35);cursor:pointer}
:root[data-theme="dark"] .fab{color:#0c1210}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fab{color:#0c1210}}
@media (min-width:900px){.fab{bottom:28px;right:max(16px,calc(50vw - 534px))}}
h1{font-size:22px;margin:6px 0 2px;letter-spacing:-.02em}
h2{font-size:16px;margin:0 0 10px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:900px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;align-items:start}}
@media (max-width:899px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.cols>*+*{margin-top:12px}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0}
.card+.card{margin-top:12px}
.grid>.card+.card{margin-top:0}
.kpi .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .val{font-size:clamp(17px,5.2vw,22px);font-weight:700;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
.kpi .foot{font-size:12px;color:var(--muted);margin-top:2px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.monthbar{display:flex;align-items:center;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
.monthbar .m{font-weight:600;font-size:15px;min-width:130px;text-align:center}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .chip.on{color:#0c1210}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.on{color:#0c1210}}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.pos{background:var(--pos-soft);color:var(--pos)}.tag.neg{background:var(--neg-soft);color:var(--neg)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.info{background:var(--info-soft);color:var(--info)}
.alert{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.alert:first-of-type{border-top:0;padding-top:2px}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.dot.alta{background:var(--neg)}.dot.media{background:var(--warn)}.dot.baja{background:var(--info)}
.alert b{font-weight:600}
.alert .d{color:var(--muted);font-size:13px}
.bars .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:7px 0;border-top:1px solid var(--border);cursor:pointer}
.bars .row:first-child{border-top:0}
.bars .n{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .v{font-size:14px;font-weight:600;text-align:right}
.bars .track{grid-column:1/3;height:6px;background:var(--surface-2);border-radius:4px;position:relative;overflow:hidden}
.bars .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent-2)}
.bars .fill.over{background:var(--neg)}
.bars .fill.prev{background:var(--accent-2);opacity:.28;border-radius:0 4px 4px 0}
.bars .row.cero .n,.bars .row.cero .v{color:var(--muted)}
.bars .budget{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text);opacity:.55}
.bars .meta{grid-column:1/3;font-size:12px;color:var(--muted)}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border);cursor:pointer}
.list .it:first-child{border-top:0}
.ico{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--muted)}
.ico svg{width:18px;height:18px}
.it .main{flex:1;min-width:0}
.it .t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .s{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:2px;min-width:0}
.it .s .ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.it .s .src{flex:none}
.it .amt{font-weight:600;text-align:right;white-space:nowrap}
.it .amt small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.day{font-size:12px;color:var(--muted);font-weight:600;margin:14px 0 2px;text-transform:capitalize}
.src{display:inline-flex;gap:3px;margin-left:4px;vertical-align:middle}
.src i{font-style:normal;font-size:10px;line-height:15px;height:15px;padding:0 4px;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.src i.n{background:var(--info-soft);color:var(--info)}.src i.e{background:var(--pos-soft);color:var(--pos)}
.src i.f{background:var(--warn-soft);color:var(--warn)}.src i.m{background:var(--accent-soft);color:var(--accent-2)}
.search{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.debt .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.debt .big{font-size:24px;font-weight:700;letter-spacing:-.02em}
.debt .facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin-top:10px}
.debt .facts div{font-size:13px}.debt .facts span{display:block;color:var(--muted);font-size:12px}
.meter{height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden;margin-top:10px}
.meter>div{height:100%;background:var(--accent-2)}
.meter.hot>div{background:var(--neg)}
.spark{width:100%;height:46px;margin-top:8px}
.ob{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.ob:first-child{border-top:0}
.ob .date{text-align:center;background:var(--surface-2);border-radius:10px;padding:4px 0;line-height:1.1}
.ob .acc{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--accent);background:transparent;color:var(--accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer;min-height:32px}
.ob .acc.q{border-color:var(--border);color:var(--muted);font-weight:500}
.ob .date b{display:block;font-size:17px}.ob .date span{font-size:11px;color:var(--muted);text-transform:uppercase}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease,visibility 0s .22s;visibility:hidden;box-shadow:0 -8px 30px rgba(0,0,0,.15)}
.sheet.open{transform:none;visibility:visible;transition:transform .22s ease}
@media (min-width:700px){.sheet{left:50%;right:auto;width:560px;transform:translate(-50%,105%);bottom:20px;border-radius:18px}.sheet.open{transform:translate(-50%,0)}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 12px}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.inp{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px}
.inp.big{font-size:24px;font-weight:700}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row2>div{min-width:0}
input[type="date"].inp{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block;min-height:44px;line-height:1.2}
select.inp{min-height:44px;max-width:100%}
@media (max-width:420px){.row2{grid-template-columns:1fr;gap:0}}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;width:100%;margin-top:14px}
:root[data-theme="dark"] .btn{color:#0c1210}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#0c1210}}
.btn.sec{background:var(--surface-2);color:var(--text)}
.btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn:disabled{opacity:.5;cursor:default}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-top:8px}
.kv span{color:var(--muted)}
.items{font-size:13px;margin-top:8px;border-top:1px solid var(--border)}
.items div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--border)}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.empty{color:var(--muted);font-size:14px;padding:12px 0}
.setup{max-width:520px;margin:40px auto}
.lock{max-width:360px;margin:0 auto;padding:46px 16px 24px;text-align:center}
.lock .brand{justify-content:center;margin-bottom:18px}
.lock h2{font-size:19px;margin:0 0 4px}
.dots{display:flex;gap:14px;justify-content:center;margin:22px 0 8px;min-height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent-2);display:block}
.dots i.on{background:var(--accent-2)}
.dots.mal{animation:sacude .35s}
@keyframes sacude{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px 26px;justify-content:center;margin:18px auto 0}
.pad button{width:76px;height:76px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:28px;font-weight:500;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pad button:active{background:var(--surface-2)}
.pad button.txt{border:0;background:transparent;font-size:15px;font-weight:600;color:var(--accent-2)}
.pad button.ico{border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.lock .msg{min-height:20px;font-size:14px;color:var(--muted);margin-top:4px}
.lock .msg.neg{color:var(--neg)}
.lock .link{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;margin-top:22px;cursor:pointer}
.setup ol{padding-left:20px;color:var(--muted);font-size:14px}
.setup ol li{margin:4px 0}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2);margin:8px 0}
.stack div{height:100%}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:10px}
.hide{display:none!important}
.more-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:900px){.more-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.more-grid button{text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:var(--r);padding:14px;cursor:pointer;box-shadow:var(--shadow)}
.more-grid button b{display:block;margin:6px 0 2px}
.more-grid button span{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.drop{border:2px dashed var(--border);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted);cursor:pointer}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{text-align:left;padding:7px 6px;border-top:1px solid var(--border)}
table.t th{color:var(--muted);font-weight:500;font-size:12px}
table.t td.r,table.t th.r{text-align:right}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ═══════════════════ Utilidades ═══════════════════ */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COP = new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
const fmt = v => COP.format(Math.round(v||0)).replace(/\s/g,' ');
const fmtS = v => { const a=Math.abs(v||0), s=v<0?'−':''; if(a>=1e6) return s+'$'+(a/1e6).toLocaleString('es-CO',{maximumFractionDigits:a>=1e7?1:2})+' M'; if(a>=1e3) return s+'$'+Math.round(a/1e3)+' mil'; return s+'$'+Math.round(a); };
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES_C = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const mesNombre = ym => { const [y,m]=ym.split('-'); return MESES[+m-1]+' '+y; };
const fechaLarga = d => { const x=new Date(d+'T12:00'); return x.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'}); };
const fechaCorta = d => { if(!d) return '—'; const [y,m,dd]=d.split('-'); return `${+dd} ${MES_C[+m-1]}`; };
const hoyISO = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const uid = () => 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
function toast(msg, ms=2600){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),ms); }
const b64 = s => btoa(unescape(encodeURIComponent(s)));
const unb64 = s => decodeURIComponent(escape(atob(s.replace(/\n/g,''))));

const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',

const S = { cfg: store.get('fin.cfg', null), data:null, manual:[], manualSha:null, ajustes:{movimientos:{},reglas:[]}, ajustesSha:null,

const GH = {
  base(){ return `https://api.github.com/repos/${S.cfg.owner}/${S.cfg.repo}`; },
  h(extra={}){ return {'Authorization':'Bearer '+S.cfg.token,'X-GitHub-Api-Version':'2022-11-28',...extra}; },
  async raw(path){ const r=await fetch(`${this.base()}/contents/${path}?ref=${S.cfg.branch||'main'}&t=${Date.now()}`,{headers:this.h({'Accept':'application/vnd.github.raw+json'})});
    if(r.status===404) return null; if(!r.ok) throw new Error(`GitHub ${r.status} al leer ${path}`); return r.text(); },
  async json(path){ const r=await fetch(`${this.base()}/contents/${path}?ref=${S.cfg.branch||'main'}&t=${Date.now()}`,{cache:'no-store',headers:this.h({'Accept':'application/vnd.github+json'})});
    if(r.status===404) return {data:null,sha:null}; if(!r.ok) throw new Error(`GitHub ${r.status} al leer ${path}`);
    const j=await r.json(); return {data: JSON.parse(unb64(j.content)), sha:j.sha}; },
  async put(path, contentB64, sha, message){ const body={message, content:contentB64, branch:S.cfg.branch||'main'}; if(sha) body.sha=sha;
    const r=await fetch(`${this.base()}/contents/${path}`,{method:'PUT',headers:this.h({'Accept':'application/vnd.github+json'}),body:JSON.stringify(body)});
    if(!r.ok){ const t=await r.text(); throw new Error(`GitHub ${r.status}: ${t.slice(0,140)}`); } return (await r.json()).content.sha; },
  async dispatch(){ const r=await fetch(`${this.base()}/actions/workflows/actualizar.yml/dispatches`,{method:'POST',headers:this.h({'Accept':'application/vnd.github+json'}),body:JSON.stringify({ref:S.cfg.branch||'main'})});
    if(!r.ok) throw new Error(`No pude lanzar la actualización (${r.status}). Revisa que el token tenga permiso de Actions.`); },
};

async function cargar(){
  if (window.FIN_DEMO){ S.demo=true; S.data=window.FIN_DEMO; S.manual=window.FIN_DEMO_MANUAL||[]; return; }
  const txt = await GH.raw('data/finanzas.json');
  if(!txt) throw new Error('No encontré data/finanzas.json en el repositorio. Ejecuta el flujo "Actualizar finanzas" una vez.');
  S.data = JSON.parse(txt);
  const [man, aj] = await Promise.all([GH.json('data/manual/movimientos.json'), GH.json('data/manual/ajustes.json')]);
  S.manual = man.data||[]; S.manualSha = man.sha; S.ajustes = aj.data||{movimientos:{},reglas:[]}; S.ajustesSha = aj.sha;
  S.ajustes.movimientos ||= {}; S.ajustes.reglas ||= [];
}

/* Mezcla lo manual que aún no procesó el flujo (aparece al instante) y aplica ajustes locales */
function movimientos(){
  const base = S.data.movimientos;
  const ids = new Set(base.map(m=>m.id));
  const conc = new Set(S.data.manuales_conciliados||[]);
  const extra = S.manual.filter(e=>!e.borrado && !ids.has(e.id) && !conc.has(e.id)).map(e=>({
    id:e.id, fecha:e.fecha, monto:+e.monto, dir:e.tipo==='ingreso'?'in':'out', medio:e.medio||'Efectivo',
    contraparte:e.descripcion||(e.tipo==='ingreso'?'Ingreso':'Gasto en efectivo'), descripcion:e.descripcion||'',
    clase:e.tipo==='ingreso'?'ingreso':'consumo', categoria:e.categoria||'Otros', fuentes:['manual'], manual:true, pendiente:true }));
  const borrados = new Set(S.manual.filter(e=>e.borrado).map(e=>e.id));
  const reglas = (S.ajustes.reglas||[]).map(r=>{ try{ return [new RegExp(r.patron,'i'), r]; }catch(e){ return null; } }).filter(Boolean);
  return [...extra, ...base].filter(m=>!borrados.has(m.id)).map(m=>{
    const o = S.ajustes.movimientos?.[m.id];
    let x = m;
    if (o){ x = {...m, ...(o.categoria?{categoria:o.categoria}:{}), ...(o.clase?{clase:o.clase}:{}), ...(o.nota?{nota:o.nota}:{}), ajustado:true}; if(o.ignorar) x.clase='interno'; }
    else if (reglas.length && !m.manual){ const txt=norm([m.contraparte,m.descripcion,m.detalle,m.emisor].join(' ')); for(const [rx,r] of reglas){ if(rx.test(txt)){ x={...m,categoria:r.categoria,clase:r.clase||m.clase}; break; } } }
    return x;
  }).sort((a,b)=> (b.fecha+(b.hora||'')).localeCompare(a.fecha+(a.hora||'')));
}
const norm = s => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9*/&.\- ]+/g,' ').replace(/\s+/g,' ').trim();

/* ═══════════════════ Cálculos del mes ═══════════════════ */
/* Ciclos de pago: de nómina a nómina (26 o el día siguiente). El id es el mes en que termina. */
function ciclos(){ return S.data.ciclos||[]; }
function ciclo(id){ return ciclos().find(c=>c.id===id) || {id, inicio:id+'-01', fin:id+'-31', etiqueta:mesNombre(id)}; }
function enCiclo(fecha, id){ const c=ciclo(id); return fecha>=c.inicio && fecha<=c.fin; }
function cicloDe(fecha){ const c=ciclos().find(c=>fecha>=c.inicio && fecha<=c.fin); return c?c.id:fecha.slice(0,7); }
function resumenMes(movs, mes){
  const r = {ingresos:0, consumo:0, consumoTC:0, efectivo:0, retiros:0, deudas:0, ahorro:0, avances:0, costos:0, porCat:{}, n:0, extra:0, porClasificar:0, nPorClasificar:0, terPag:0, terReem:0};
  const c = ciclo(mes);
  for (const m of movs){
    if (m.fecha<c.inicio || m.fecha>c.fin) continue;
    r.n++;
    if (m.clase==='tercero'){ if(m.dir==='out') r.terPag+=m.monto; else r.terReem+=m.monto; continue; }
    if (m.clase==='ingreso') r.ingresos+=m.monto;
    else if (m.clase==='consumo' && m.dir==='out'){
      r.consumo+=m.monto; r.porCat[m.categoria]=(r.porCat[m.categoria]||0)+m.monto;
      if (m.medio==='Tarjeta de crédito') r.consumoTC+=m.monto;
      if (m.medio==='Efectivo') r.efectivo+=m.monto;
      if (m.extraordinario) r.extra+=m.monto;
      if (m.categoria==='Por clasificar'){ r.porClasificar+=m.monto; r.nPorClasificar++; }
    }
    else if (m.clase==='retiro') r.retiros+=m.monto;
    else if (m.clase==='deuda') r.deudas+=m.monto;
    else if (m.clase==='ahorro') r.ahorro+=m.monto;
    else if (m.clase==='credito') r.avances+=m.monto;
    else if (m.clase==='costo_financiero') r.costos+= m.dir==='out'? m.monto : -m.monto;
  }
  r.sinDetallar = Math.max(0, r.retiros - r.efectivo);
  if (r.sinDetallar>0){ r.porCat['Efectivo sin detallar']=r.sinDetallar; }
  r.gastoTotal = r.consumo + r.sinDetallar;
  r.salidas = (r.consumo - r.consumoTC - r.efectivo) + r.retiros + r.deudas + r.ahorro;
  r.balance = r.ingresos - r.salidas;
  return r;
}

function monthbar(){

function vInicio(movs){
  const r = resumenMes(movs, S.mes);
  const pres = S.data.presupuesto||{};
  const porPagar = {};
  if (S.mes===S.data.ciclo_actual) for (const o of obVivas()){
    if (o.ciclo!==S.mes || !o.categoria || o.tipo==='variable' || o.estado==='pagado' || !o.monto) continue;
    const x = porPagar[o.categoria] ||= {v:0, items:[]}; x.v += o.monto; x.items.push(`${o.concepto} ${fechaCorta(o.fecha)}`); }
  const nombres = new Set([...Object.keys(r.porCat), ...Object.keys(pres), ...Object.keys(porPagar)]);
  const cats = [...nombres].map(c=>[c, r.porCat[c]||0]).sort((a,b)=>(b[1]-a[1]) || ((pres[b[0]]||0)-(pres[a[0]]||0)));
  const maxV = Math.max(1, ...cats.map(([c,v])=>Math.max(v+(porPagar[c]?.v||0), pres[c]||0)));
  const pm = S.ajustes.pagos_marcados||{};
  const alertas = (S.data.alertas||[]).filter(a=>!(a.clave && pm[a.clave]));
  const prox = obVivas().filter(o=>o.ciclo===S.data.ciclo_actual && o.tipo!=='variable' && !['pagado'].includes(o.estado)).slice(0,7);
  const cal = S.data.calidad?.[S.mes];
  const deudaTotal = (S.data.deudas||[]).reduce((a,d)=>a+(d.saldo||0),0);
  return `${monthbar()}
  <div class="grid g4">
    <div class="card kpi"><div class="lab">Entró</div><div class="val num pos">${fmtS(r.ingresos)}</div><div class="foot">${r.avances?`+ ${fmtS(r.avances)} prestados (avances)`:'Ingresos del ciclo'}</div></div>
    <div class="card kpi"><div class="lab">Salió de tu bolsillo</div><div class="val num">${fmtS(r.salidas)}</div><div class="foot">Gastos de contado, deudas y retiros</div></div>
    <div class="card kpi"><div class="lab">Balance</div><div class="val num ${r.balance<0?'neg':'pos'}">${fmtS(r.balance)}</div><div class="foot">${r.balance<0?'Gastaste más de lo que entró':'Te quedó disponible'}</div></div>
    <div class="card kpi"><div class="lab">Compras con tarjeta</div><div class="val num warn">${fmtS(r.consumoTC)}</div><div class="foot">Se vuelven deuda · total deudas ${fmtS(deudaTotal)}</div></div>
  </div>
  <div class="cols" style="margin-top:12px">
    <div>
      <div class="card"><h2>En qué se te va la plata <span class="sub">· ${fmt(r.gastoTotal)}</span></h2>
        ${cats.length? `<div class="bars">${cats.map(([c,v])=>{ const p=pres[c]; const over=p&&v>p;
          const pp=porPagar[c];
          return `<div class="row ${v?'':'cero'}" data-cat="${esc(c)}"><div class="n">${esc(c)}</div><div class="v num">${fmt(v)}</div>
          <div class="track"><div class="fill ${over?'over':''}" style="width:${(100*v/maxV).toFixed(1)}%"></div>${pp?`<div class="fill prev" style="left:${(100*v/maxV).toFixed(1)}%;width:${(100*pp.v/maxV).toFixed(1)}%"></div>`:''}${p?`<div class="budget" style="left:${(100*p/maxV).toFixed(1)}%"></div>`:''}</div>
          <div class="meta">${p?`Presupuesto ${fmt(p)} · ${over?'<span class="neg">te pasaste '+fmt(v-p)+'</span>':'quedan '+fmt(p-v)}`:(v?'':'Sin gastos en este ciclo')}${pp?`${p||!v?'<br>':''}Por pagar ${fmt(pp.v)}: ${esc(pp.items.join(', '))}`:''}</div></div>`; }).join('')}</div>`

function grafMeses(movs){
  const ms = ciclos().filter(c=>c.inicio<=S.data.hoy).slice(0,7).map(c=>c.id).reverse();
  if(!ms.length) return '<div class="empty">Sin datos.</div>';
  const rs = ms.map(m=>({m, ...resumenMes(movs,m)}));
  const max = Math.max(1,...rs.map(r=>Math.max(r.ingresos,r.gastoTotal)));
  const W=640,H=200,pad=28,bw=(W-pad)/ms.length;
  const y=v=>H-22-(H-40)*v/max;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos por mes">`;
  [0.5,1].forEach(f=>{ s+=`<line x1="${pad}" x2="${W}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="var(--border)"/><text x="0" y="${y(max*f)+4}" font-size="10" fill="var(--faint)">${fmtS(max*f).replace('$','')}</text>`; });
  rs.forEach((r,i)=>{ const x=pad+i*bw+bw*0.18, w=bw*0.3;
    s+=`<rect x="${x}" y="${y(r.ingresos)}" width="${w}" height="${H-22-y(r.ingresos)}" rx="3" fill="var(--c1)"><title>Ingresos ${fmt(r.ingresos)}</title></rect>`;
    s+=`<rect x="${x+w+3}" y="${y(r.gastoTotal)}" width="${w}" height="${H-22-y(r.gastoTotal)}" rx="3" fill="var(--c3)"><title>Gastos ${fmt(r.gastoTotal)}</title></rect>`;
    s+=`<text x="${x+w}" y="${H-6}" font-size="11" text-anchor="middle" fill="var(--muted)" ${r.m===S.mes?'font-weight="700"':''}>${esc(ciclo(r.m).etiqueta.split('–')[1]||'').trim()}</text>`; });
  return s+`</svg><div class="legend"><span><i style="background:var(--c1)"></i>Ingresos</span><span><i style="background:var(--c3)"></i>Gastos (consumo, incluye tarjeta)</span></div><div class="sub" style="margin-top:4px">Cada barra es un ciclo de nómina; la etiqueta es el día en que termina.</div>`;
}
function coberturaHTML(c){
  const parts=[['notificado_y_confirmado','Avisado y confirmado en extracto','var(--c1)'],['solo_notificacion','Solo aviso del banco','var(--c2)'],['solo_extracto','Solo en el extracto (sin aviso)','var(--c3)'],['solo_factura','Solo factura electrónica','var(--c4)'],['manual','Registrado a mano','var(--c6)']];
  const tot=c.total||1;
  const sinAviso=(c.solo_extracto||0)+(c.solo_factura||0);
  return `<div class="stack">${parts.map(([k,,col])=>c[k]?`<div style="width:${100*c[k]/tot}%;background:${col}" title="${k}"></div>`:'').join('')}</div>

/* ─────────── Deudas ─────────── */
function tasaEA(d){
  if (d.tasa_ea) return d.tasa_ea;
  if (d.intereses_mes && d.saldo){ const i=d.intereses_mes/(d.saldo-d.intereses_mes); return +(100*(Math.pow(1+i,12)-1)).toFixed(1); }
  return null;
}
function vDeudas(){

  const ing = (S.data.ingresos_config||[]).reduce((a,i)=>a+(i.neto_esperado||0),0);
  const comultrasan = ds.find(d=>d.descuento_nomina);

  <div class="grid g4" style="margin-top:12px">

    <div class="card kpi"><div class="lab">Cuotas del mes</div><div class="val num">${fmtS(cuotas)}</div><div class="foot">${base?Math.round(100*cuotas/base)+'% de tu salario':''}</div></div>
    <div class="card kpi"><div class="lab">Intereses del mes</div><div class="val num neg">${fmtS(intereses)}</div><div class="foot">Lo que te cuesta deber</div></div>
    <div class="card kpi"><div class="lab">Más cara</div><div class="val" style="font-size:17px">${esc(orden[0]?.nombre||'—')}</div><div class="foot">${tasaEA(orden[0]||{})?'≈ '+tasaEA(orden[0])+'% efectivo anual':''}</div></div>
  </div>
  <div class="note">Si te sobra plata para abonar, hazlo en este orden (de la más cara a la más barata): ${orden.map(d=>`<b>${esc(d.nombre)}</b>${tasaEA(d)?' ('+tasaEA(d)+'%)':''}`).join(' → ')}.</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:12px">${ds.map(debtCard).join('')}</div>`;

function estadoTag(e){ const m={pagado:'pos',pendiente:'warn',vencido:'neg','por confirmar':'info','sin confirmar':'info','descuento de nómina':'','descuento nómina':'',programado:'info',estimado:'','en curso':'info',superado:'neg',previsto:'',cerrado:''}; return `<span class="tag ${m[e]??''}">${esc(e||'')}</span>`; }

function debtCard(d){

      ${t?`<div><span>Tasa efectiva anual</span><b>${t}%</b></div>`:''}
      ${d.cuotas_pendientes?`<div><span>Cuotas pendientes</span><b>${d.cuotas_pendientes}</b></div>`:''}
      ${d.saldo_en_cuotas?`<div><span>Compras a cuotas por pagar</span><b class="num">${fmt(d.saldo_en_cuotas)}</b></div>`:''}

    </div>
    ${d.tipo==='tc'&&d.desglose_minimo?tcDesglose(d):''}
    ${d.tipo==='tc'&&d.pago_minimo&&d.saldo?`<div class="note">Pagar solo el mínimo deja ${fmt(d.saldo-d.pago_minimo)} generando intereses al ${t||'—'}% anual.</div>`:''}

}

    if(o.marcado && S.desmarcadas?.has(k)) return {...o, clave:k, estado:'pendiente', marcado:false, fuente:'marca quitada · se recalcula en unos minutos'};

/* Guarda un JSON del repositorio. Justo después de guardar, GitHub a veces entrega la versión
   anterior del archivo; con esa versión el siguiente guardado fallaba (error 409). Aquí se detecta,
   se usa la copia recién guardada y, si hay un choque, se reintenta. */
const ULTIMO = {};
function mensajeGH(e){
  const t = e?.message||String(e);
  if (/GitHub 409|GitHub 422/.test(t)) return 'Otro cambio se estaba guardando al mismo tiempo. Espera unos segundos y vuelve a intentarlo.';
  if (/GitHub 401|GitHub 403/.test(t)) return 'GitHub rechazó el token (venció o no tiene permiso de escritura). Revísalo en Más → Conexión.';
  if (/Failed to fetch|NetworkError/.test(t)) return 'Sin conexión con GitHub. Revisa tu internet e intenta de nuevo.';
  return t;
}
async function guardarJSON(path, vacio, fn, msg){
  let error;
  for (let i=0; i<4; i++){
    let cur = await GH.json(path);
    const u = ULTIMO[path];
    if (u && cur.sha === u.prev) cur = {data: JSON.parse(JSON.stringify(u.data)), sha: u.sha};
    const nuevo = fn(cur.data ?? JSON.parse(JSON.stringify(vacio)));
    try{
      const sha = await GH.put(path, b64(JSON.stringify(nuevo,null,1)), cur.sha, msg);
      ULTIMO[path] = {prev: cur.sha, sha, data: nuevo};
      return {data: nuevo, sha};
    }catch(e){
      error = e;
      if (!/GitHub (409|422)/.test(e.message)) break;
      await new Promise(r=>setTimeout(r, 1500*(i+1)));
    }
  }
  throw new Error(mensajeGH(error));
}
async function guardarManual(fn, msg){
  if (S.demo){ S.manual = fn(JSON.parse(JSON.stringify(S.manual))); toast('Vista previa: no se guardó en GitHub'); return; }
  const r = await guardarJSON('data/manual/movimientos.json', [], fn, msg);
  S.manual = r.data; S.manualSha = r.sha;
}
async function guardarAjuste(fn, msg){
  const conBase = a => { a.movimientos ||= {}; a.reglas ||= []; return fn(a); };
  if (S.demo){ S.ajustes = conBase(JSON.parse(JSON.stringify(S.ajustes))); return; }
  const r = await guardarJSON('data/manual/ajustes.json', {movimientos:{},reglas:[]}, conBase, msg);
  S.ajustes = r.data; S.ajustesSha = r.sha;
}
async function subirPDF(file, tipo){
  if(!file) return;
  if(file.size>15e6){ toast('El archivo pesa más de 15 MB'); return; }
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(!['pdf','zip','xml'].includes(ext)){ toast('Solo PDF, ZIP o XML'); return; }
  if(ext==='pdf' && tipo==='factura'){ toast('La factura electrónica se sube en ZIP o XML: el PDF solo no trae los datos',5000); return; }
  if(ext!=='pdf') tipo='';
  const info=$('#upInfo'); info.textContent='Subiendo…';
  if (S.demo){ info.textContent='Vista previa: el archivo no se sube.'; return; }
  const buf=new Uint8Array(await file.arrayBuffer()); let bin=''; for(let i=0;i<buf.length;i+=0x8000) bin+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
  const nombre=(tipo?tipo+'__':'')+Date.now()+'_'+file.name.replace(/[^\w.\-]+/g,'_');
  try{ await GH.put('inbox/'+nombre, btoa(bin), null, `Documento subido desde la app: ${file.name}`);
    info.innerHTML='Listo. Se procesa en 1–3 minutos; luego toca <b>Actualizar</b> arriba.'; toast('Archivo subido'); }
  catch(e){ info.textContent=e.message; }
}
async function actualizarAhora(){
  if (S.demo){ toast('Vista previa: sin conexión a GitHub'); return; }
  try{ await GH.dispatch(); toast('Leyendo tu correo… recarga en 2 minutos',4000);
    setTimeout(async()=>{ try{ await cargar(); render(); toast('Datos actualizados'); }catch(e){} }, 120000);
  }catch(e){
    try{ await cargar(); render(); toast('Datos recargados'); }catch(e2){ toast(e.message,5000); }
  }
}

/* ═══════════════════ Seguridad: clave y Face ID ═══════════════════
   El token de GitHub no queda guardado en claro: se cifra (AES-GCM) con una llave que sale de tu
   clave (PBKDF2, 310.000 vueltas). Con Face ID se guarda otra copia cifrada con una llave que el
   teléfono solo entrega después de reconocer tu cara (passkey WebAuthn, extensión PRF). Si el
   navegador no tiene PRF, la llave queda en este dispositivo y solo se usa tras Face ID. */
const SEG = {
  ITER: 310000, te: new TextEncoder(), td: new TextDecoder(),
  b64u(buf){ let s=''; new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); },
  deb64u(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); },
  rnd(n){ return crypto.getRandomValues(new Uint8Array(n)); },
  async llavePin(pin, salt){ const base=await crypto.subtle.importKey('raw', this.te.encode(pin), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:this.ITER, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']); },
  async llavePRF(secreto){ const base=await crypto.subtle.importKey('raw', secreto, 'HKDF', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'HKDF', hash:'SHA-256', salt:this.te.encode('mis-finanzas'), info:this.te.encode('token-github')}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']); },
  async cifrar(llave, texto){ const iv=this.rnd(12); const ct=await crypto.subtle.encrypt({name:'AES-GCM', iv}, llave, this.te.encode(texto)); return {iv:this.b64u(iv), ct:this.b64u(ct)}; },
  async descifrar(llave, o){ return this.td.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:this.deb64u(o.iv)}, llave, this.deb64u(o.ct))); },
  db(){ return new Promise((ok,mal)=>{ const r=indexedDB.open('fin-seguridad',1); r.onupgradeneeded=()=>r.result.createObjectStore('llaves'); r.onsuccess=()=>ok(r.result); r.onerror=()=>mal(r.error); }); },
  async idbPut(k,v){ const d=await this.db(); return new Promise((ok,mal)=>{ const t=d.transaction('llaves','readwrite'); t.objectStore('llaves').put(v,k); t.oncomplete=()=>ok(); t.onerror=()=>mal(t.error); }); },
  async idbGet(k){ const d=await this.db(); return new Promise((ok,mal)=>{ const r=d.transaction('llaves','readonly').objectStore('llaves').get(k); r.onsuccess=()=>ok(r.result); r.onerror=()=>mal(r.error); }); },
  async idbDel(k){ try{ const d=await this.db(); await new Promise(ok=>{ const t=d.transaction('llaves','readwrite'); t.objectStore('llaves').delete(k); t.oncomplete=ok; t.onerror=ok; }); }catch(e){} },
  async bioDisponible(){ try{ return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }catch(e){ return false; } },
  uvOk(authData){ const a=new Uint8Array(authData); return a.length>32 && (a[32] & 0x04)!==0; },
};
const BIO = /iPhone|iPad|Macintosh/.test(navigator.userAgent) ? 'Face ID' : 'huella o rostro';
const AUTO_OPC = [[0,'Al salir'],[2,'2 min'],[10,'10 min']];

/* Guarda la configuración sin el token en claro */
function guardarCfg(){ const {token, ...resto} = S.cfg; store.set('fin.cfg', resto); }

function intentos(){ return store.get('fin.intentos', {n:0, hasta:0}); }

/* Teclado numérico. modo: 'entrar' | 'crear' | 'confirmar' */
function teclado({titulo, sub, n, alCompletar, conBio, pie}){
  let pin='';
  $('#app').innerHTML = `<div class="lock"><div class="brand"><div class="logo">${ICON.logo}</div><span style="font-size:20px">Mis finanzas</span></div>
    <h2>${titulo}</h2><div class="sub">${sub||''}</div>
    <div class="dots" id="dots"></div><div class="msg" id="lmsg"></div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-d="${d}">${d}</button>`).join('')}
      ${conBio?`<button class="ico" id="kBio" aria-label="Entrar con ${BIO}">${ICON.cara}</button>`:(n?'<span></span>':`<button class="txt" id="kOk">Listo</button>`)}
      <button data-d="0">0</button><button class="ico" id="kDel" aria-label="Borrar">${ICON.borrar}</button></div>
    ${pie||''}</div>`;
  const pintar=()=>{ const total=n||Math.max(4,pin.length); $('#dots').innerHTML=Array.from({length:total},(_,i)=>`<i class="${i<pin.length?'on':''}"></i>`).join(''); };
  const msg=(t,mal)=>{ const m=$('#lmsg'); m.textContent=t||''; m.className='msg'+(mal?' neg':''); };
  const fallo=t=>{ pin=''; pintar(); msg(t,true); const d=$('#dots'); d.classList.remove('mal'); void d.offsetWidth; d.classList.add('mal'); };
  let ocupado=false;
  const enviar=async()=>{ if(ocupado) return; ocupado=true; msg('Verificando…'); try{ await alCompletar(pin, fallo); }finally{ ocupado=false; } };
  const tecla=d=>{ if(ocupado) return; if(d==='del'){ pin=pin.slice(0,-1); msg(''); pintar(); return; }
    if(pin.length>=8) return; pin+=d; msg(''); pintar(); if(n && pin.length===n) enviar(); };
  document.querySelectorAll('.pad [data-d]').forEach(b=>b.onclick=()=>tecla(b.dataset.d));
  $('#kDel').onclick=()=>tecla('del');
  if($('#kOk')) $('#kOk').onclick=()=>{ if(pin.length<4){ fallo('Usa entre 4 y 8 dígitos'); return; } enviar(); };
  document.onkeydown=e=>{ if(!$('.lock')) { document.onkeydown=null; return; }
    if(/^[0-9]$/.test(e.key)) tecla(e.key); else if(e.key==='Backspace') tecla('del'); else if(e.key==='Enter' && $('#kOk')) $('#kOk').click(); };
  pintar();
  return {msg, fallo};
}

function vCrearClave(anterior){
  const sub = anterior ? 'Ahora la app se protege con una clave. Elige entre 4 y 8 dígitos y luego toca Listo.' : 'Elige entre 4 y 8 dígitos y luego toca Listo.';
  teclado({titulo:'Crea tu clave', sub, alCompletar: async (pin)=>{
    teclado({titulo:'Repite tu clave', sub:'Para confirmar.', n:pin.length, alCompletar: async (pin2, fallo)=>{
      if (pin2!==pin){ fallo('No coincide. Vuelve a intentarlo.'); setTimeout(()=>vCrearClave(anterior),900); return; }
      await fijarClave(pin);
      if (await SEG.bioDisponible()) vOfrecerBio(); else entrar();
    }});
  }});
}
async function fijarClave(pin){
  const salt=SEG.rnd(16); const llave=await SEG.llavePin(pin, salt);
  S.cfg.seg = {...(S.cfg.seg||{}), pin:{salt:SEG.b64u(salt), n:pin.length, ...(await SEG.cifrar(llave, S.cfg.token))}, auto:S.cfg.seg?.auto ?? 2};
  guardarCfg();
}
function vOfrecerBio(){
  $('#app').innerHTML = `<div class="lock"><div class="brand"><div class="logo">${ICON.logo}</div><span style="font-size:20px">Mis finanzas</span></div>
    <div style="color:var(--accent-2);margin:10px 0">${ICON.cara.replace('width="34" height="34"','width="64" height="64"')}</div>
    <h2>¿Entrar con ${BIO}?</h2><div class="sub">Así no tienes que escribir la clave cada vez. El teléfono te pedirá guardar una llave de acceso para esta página.</div>
    <button class="btn" id="bSi">Activar ${BIO}</button><button class="btn sec" id="bNo">Ahora no</button><div class="msg" id="lmsg"></div></div>`;
  $('#bSi').onclick=async()=>{ $('#bSi').disabled=true; try{ await activarBio(); toast(BIO+' activado'); entrar(); }
    catch(e){ $('#bSi').disabled=false; $('#lmsg').textContent=errorBio(e); $('#lmsg').className='msg neg'; } };
  $('#bNo').onclick=()=>entrar();
}
function errorBio(e){
  if (e?.name==='NotAllowedError') return `Se canceló o no se pudo usar ${BIO}. Puedes intentarlo de nuevo.`;
  if (e?.name==='InvalidStateError') return `Ya hay una llave guardada para esta página. Intenta de nuevo.`;
  return e?.message || String(e);
}
async function activarBio(){
  const prfSalt=SEG.rnd(32);
  const cred = await navigator.credentials.create({publicKey:{
    rp:{name:'Mis finanzas', id:location.hostname}, user:{id:SEG.rnd(16), name:'Mis finanzas', displayName:'Mis finanzas'},
    challenge:SEG.rnd(32), pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform', userVerification:'required', residentKey:'preferred'},
    timeout:60000, attestation:'none', extensions:{prf:{eval:{first:prfSalt}}} }});
  const ext = cred.getClientExtensionResults?.() || {};
  let secreto = ext.prf?.results?.first;
  if (!secreto && ext.prf?.enabled){
    try{ const a = await navigator.credentials.get({publicKey:{challenge:SEG.rnd(32), rpId:location.hostname, allowCredentials:[{type:'public-key', id:cred.rawId}],
        userVerification:'required', timeout:60000, extensions:{prf:{eval:{first:prfSalt}}}}});
      secreto = a.getClientExtensionResults?.().prf?.results?.first; }catch(e){ /* sigue sin PRF */ }
  }
  let llave, modo;
  if (secreto){ llave=await SEG.llavePRF(secreto); modo='prf'; }
  else { llave=await crypto.subtle.generateKey({name:'AES-GCM', length:256}, false, ['encrypt','decrypt']); await SEG.idbPut('bio', llave); modo='llave'; }
  S.cfg.seg.bio = {credId:SEG.b64u(cred.rawId), modo, prfSalt:SEG.b64u(prfSalt), ...(await SEG.cifrar(llave, S.cfg.token))};
  guardarCfg();
}
async function tokenConBio(){
  const b=S.cfg.seg.bio;
  const pk={challenge:SEG.rnd(32), rpId:location.hostname, allowCredentials:[{type:'public-key', id:SEG.deb64u(b.credId)}], userVerification:'required', timeout:60000};
  if (b.modo==='prf') pk.extensions={prf:{eval:{first:SEG.deb64u(b.prfSalt)}}};
  const a = await navigator.credentials.get({publicKey:pk});
  if (SEG.b64u(a.rawId)!==b.credId || !SEG.uvOk(a.response.authenticatorData)) throw new Error(`${BIO} no confirmó tu identidad.`);
  let llave;
  if (b.modo==='prf'){ const sec=a.getClientExtensionResults?.().prf?.results?.first; if(!sec) throw new Error(`${BIO} no entregó la llave. Entra con tu clave.`); llave=await SEG.llavePRF(sec); }
  else { llave=await SEG.idbGet('bio'); if(!llave) throw new Error(`Se perdió la llave de ${BIO} en este teléfono. Entra con tu clave y vuelve a activarlo en Más → Seguridad.`); }
  return SEG.descifrar(llave, b);
}
function vBloqueo(alAbrir){
  S.bloqueado=true; S.cfg.token=null; try{ cerrarSheet(); }catch(e){}
  const seg=S.cfg.seg; const conBio=!!seg.bio;
  const k = teclado({titulo:'Ingresa tu clave', sub: conBio?`O toca la cara para usar ${BIO}.`:'', n:seg.pin.n, conBio,
    pie:`<button class="link" id="kOlvide">¿Olvidaste tu clave?</button>`,
    alCompletar: async (pin, fallo)=>{
      const it=intentos();
      if (it.hasta>Date.now()){ fallo(`Demasiados intentos. Espera ${Math.ceil((it.hasta-Date.now())/1000)} segundos.`); return; }
      try{ const llave=await SEG.llavePin(pin, SEG.deb64u(seg.pin.salt)); S.cfg.token=await SEG.descifrar(llave, seg.pin); }
      catch(e){ const n=it.n+1; store.set('fin.intentos', {n, hasta: n>=5 ? Date.now()+30000*(n-4) : 0});
        fallo(n>=5?'Clave incorrecta. Espera 30 segundos.':'Clave incorrecta'); return; }
      store.set('fin.intentos', {n:0, hasta:0}); entrar();
    }});
  const usarBio=async(silencioso)=>{ try{ k.msg(''); S.cfg.token=await tokenConBio(); store.set('fin.intentos',{n:0,hasta:0}); entrar(); }
    catch(e){ if(!silencioso) k.msg(errorBio(e), true); } };
  if ($('#kBio')) $('#kBio').onclick=()=>usarBio(false);
  $('#kOlvide').onclick=async()=>{ if(!confirm('Se borrará el acceso guardado en este teléfono. Para entrar de nuevo tendrás que pegar tu token de GitHub (o crear uno nuevo). ¿Continuar?')) return;
    await SEG.idbDel('bio'); const {owner,repo,branch}=S.cfg; S.cfg={owner,repo,branch}; localStorage.removeItem('fin.cfg'); S.bloqueado=false; vSetup(); };
  if (conBio && alAbrir) usarBio(true);
}
async function entrar(){
  S.bloqueado=false; document.onkeydown=null;
  if (S.data){ render(); try{ await cargar(); render(); }catch(e){} return; }
  $('#app').innerHTML='<div class="setup"><div class="empty">Cargando tus finanzas…</div></div>';
  try{ await cargar(); render(); }catch(e){ if(/401|403/.test(e.message)) vSetup('GitHub rechazó el token guardado (venció o lo revocaste). Pega uno nuevo.'); else { toast(e.message,6000); vBloqueo(); } }
}
function bloquear(){ if (S.cfg?.seg?.pin) vBloqueo(); }
/* Bloqueo automático al volver a la app después de un rato */
document.addEventListener('visibilitychange', ()=>{
  if (!S.cfg?.seg?.pin || S.demo) return;
  if (document.hidden){ S.ocultoDesde=Date.now(); if ((S.cfg.seg.auto??2)===0 && !S.bloqueado) vBloqueo(); return; }
  if (!S.bloqueado && S.ocultoDesde && Date.now()-S.ocultoDesde > (S.cfg.seg.auto??2)*60000) vBloqueo(true);
});
function vSeguridad(){
  const seg=S.cfg?.seg||{};
  return `${volver}<h1>Seguridad</h1><div class="sub">Tu token de GitHub queda cifrado en este teléfono; sin tu clave o tu ${BIO} no se puede usar.</div>
  <div class="card"><h2>Clave</h2><div class="sub">${seg.pin?`Tienes una clave de ${seg.pin.n} dígitos.`:'Aún no tienes clave.'}</div>
    <button class="btn sec" id="sgClave">${seg.pin?'Cambiar clave':'Crear clave'}</button>
    ${seg.pin?'<button class="btn sec" id="sgLock">Bloquear ahora</button>':''}</div>
  <div class="card"><h2>${BIO}</h2><div class="sub" id="sgBioInfo">${seg.bio?`Activado${seg.bio.modo==='prf'?' (la llave la entrega el teléfono solo con tu cara)':''}.`:'No está activado.'}</div>
    <button class="btn ${seg.bio?'danger':''}" id="sgBio">${seg.bio?'Desactivar '+BIO:'Activar '+BIO}</button></div>
  <div class="card"><h2>Bloqueo automático</h2><div class="sub">Pedir la clave al volver a la app después de:</div>
    <div class="seg" style="margin-top:8px">${AUTO_OPC.map(([v,l])=>`<button data-auto="${v}" class="${(seg.auto??2)===v?'on':''}">${l}</button>`).join('')}</div></div>`;
}
function wireSeguridad(){
  if (!$('#sgClave')) return;
  $('#sgClave').onclick=()=>{ S.bloqueado=true; teclado({titulo:'Nueva clave', sub:'Elige entre 4 y 8 dígitos y toca Listo.', alCompletar: async pin=>{
      teclado({titulo:'Repite la nueva clave', n:pin.length, alCompletar: async (pin2, fallo)=>{
        if(pin2!==pin){ fallo('No coincide.'); setTimeout(()=>{ S.bloqueado=false; render(); },900); return; }
        await fijarClave(pin); S.bloqueado=false; document.onkeydown=null; render(); toast('Clave actualizada'); }}); }});
    const pie=document.createElement('button'); pie.className='link'; pie.textContent='Cancelar'; pie.onclick=()=>{ S.bloqueado=false; document.onkeydown=null; render(); }; $('.lock').appendChild(pie); };
  if ($('#sgLock')) $('#sgLock').onclick=bloquear;
  $('#sgBio').onclick=async()=>{
    if (S.cfg.seg?.bio){ if(!confirm(`¿Desactivar ${BIO}?`)) return; delete S.cfg.seg.bio; await SEG.idbDel('bio'); guardarCfg(); render(); toast(BIO+' desactivado'); return; }
    if (!S.cfg.seg?.pin){ toast('Primero crea una clave'); return; }
    if (!(await SEG.bioDisponible())){ toast(`Este navegador no permite ${BIO} en páginas web. Sigue usando tu clave.`,6000); return; }
    try{ await activarBio(); render(); toast(BIO+' activado'); }catch(e){ toast(errorBio(e),6000); } };
  document.querySelectorAll('[data-auto]').forEach(b=>b.onclick=()=>{ S.cfg.seg.auto=+b.dataset.auto; guardarCfg(); render(); });
}

/* ═══════════════════ Configuración inicial ═══════════════════ */
function vSetup(err){
  const c=S.cfg||{owner:'fagarciafo',repo:'gastos',branch:'main',token:''};
  $('#app').innerHTML=`<div class="setup"><div class="brand" style="margin-bottom:14px"><div class="logo">${ICON.logo}</div><span style="font-size:20px">Mis finanzas</span></div>
  <div class="card"><h2>Conecta tu repositorio</h2><div class="sub">Los datos viven en tu repositorio privado de GitHub. Esta página no guarda nada en ningún servidor: el token queda solo en este dispositivo.</div>
  ${err?`<div class="note neg">${esc(err)}</div>`:''}
  <div class="row2"><div><label class="f">Usuario u organización</label><input class="inp" id="sOwner" value="${esc(c.owner)}" placeholder="tu-usuario"></div>
  <div><label class="f">Repositorio</label><input class="inp" id="sRepo" value="${esc(c.repo)}"></div></div>
  <label class="f">Token de acceso (fine-grained)</label><input class="inp" id="sTok" type="password" value="${esc(c.token||'')}" placeholder="github_pat_…" autocomplete="off">
  <button class="btn" id="sGo">Entrar</button>
  <ol><li>En GitHub: Settings → Developer settings → Fine-grained tokens → Generate new token.</li><li>Repository access: solo el repositorio de finanzas.</li><li>Permisos: <b>Contents</b> lectura y escritura, <b>Actions</b> lectura y escritura.</li></ol></div></div>`;
  $('#sGo').onclick=async()=>{ S.cfg={owner:$('#sOwner').value.trim(),repo:$('#sRepo').value.trim(),branch:'main',token:$('#sTok').value.trim()};
    $('#sGo').disabled=true; $('#sGo').textContent='Conectando…';
    try{ await cargar(); vCrearClave(); }catch(e){ vSetup(e.message); } };
}
function aplicarTema(){ const t=store.get('fin.tema','auto'); if(t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t); }

(async function init(){
  aplicarTema();
  if (window.FIN_DEMO){ await cargar(); render(); return; }
  if (S.cfg?.seg?.pin){ vBloqueo(true); return; }
  if (!S.cfg?.token){ vSetup(); return; }
  // Instalación anterior: el token estaba guardado sin cifrar. Se pide crear la clave.
  $('#app').innerHTML='<div class="setup"><div class="empty">Cargando tus finanzas…</div></div>';
  try{ await cargar(); vCrearClave(true); }catch(e){ vSetup(e.message); }
})();
</script>
