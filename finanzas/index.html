<style>

  --pos-soft:#15301f; --neg-soft:#3a1d19; --warn-soft:#33281a; --info-soft:#18273a;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#0c1210; --surface:#141c18; --surface-2:#1b2520; --text:#e6eee9; --muted:#9db0a6; --faint:#6f8279;
  --border:#26332d; --accent:#9fe3bf; --accent-2:#5cc28f; --accent-soft:#183026;

.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 12px}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.inp{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;width:100%;margin-top:14px}

.items{font-size:13px;margin-top:8px;border-top:1px solid var(--border)}

.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}

.setup{max-width:520px;margin:40px auto}

.lock .msg{min-height:20px;font-size:14px;color:var(--muted);margin-top:4px}

<body>
<div class="app" id="app"></div>

<script>
/* Pantalla de entrada. La app completa vive en el repositorio privado (app/index.html)
   y solo se descarga después de desbloquear el token con la clave o con Face ID. */
(function(){
'use strict';
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
function toast(msg, ms=2600){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),ms); }
const ICON = {
  logo:'<svg viewBox="0 0 24 24" fill="none" stroke="#b8f2d0" stroke-width="3" stroke-linecap="round"><path d="M6 17V9m6 8v-6m6 6V5"/></svg>',
  cara:'<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8V5a2 2 0 012-2h3M16 3h3a2 2 0 012 2v3M21 16v3a2 2 0 01-2 2h-3M8 21H5a2 2 0 01-2-2v-3"/><path d="M9 9v1.5M15 9v1.5M12 9v4h-1M9 16c1.6 1.3 4.4 1.3 6 0"/></svg>',
  borrar:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 5h11a1 1 0 011 1v12a1 1 0 01-1 1H9l-6-7z"/><path d="M12 9l6 6M18 9l-6 6"/></svg>',
};
const S = { cfg: store.get('fin.cfg', null) };

const SEG = {
  ITER: 310000, te: new TextEncoder(), td: new TextDecoder(),
  b64u(buf){ let s=''; new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); },
  deb64u(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); },
  rnd(n){ return crypto.getRandomValues(new Uint8Array(n)); },
  async llavePin(pin, salt){ const base=await crypto.subtle.importKey('raw', this.te.encode(pin), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:this.ITER, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']); },
  async llavePRF(secreto){ const base=await crypto.subtle.importKey('raw', secreto, 'HKDF', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'HKDF', hash:'SHA-256', salt:this.te.encode('mis-finanzas'), info:this.te.encode('token-github')}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']); },
  async cifrar(llave, texto){ const iv=this.rnd(12); const ct=await crypto.subtle.encrypt({name:'AES-GCM', iv}, llave, this.te.encode(texto)); return {iv:this.b64u(iv), ct:this.b64u(ct)}; },
  async descifrar(llave, o){ return this.td.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:this.deb64u(o.iv)}, llave, this.deb64u(o.ct))); },
  db(){ return new Promise((ok,mal)=>{ const r=indexedDB.open('fin-seguridad',1); r.onupgradeneeded=()=>r.result.createObjectStore('llaves'); r.onsuccess=()=>ok(r.result); r.onerror=()=>mal(r.error); }); },
  async idbPut(k,v){ const d=await this.db(); return new Promise((ok,mal)=>{ const t=d.transaction('llaves','readwrite'); t.objectStore('llaves').put(v,k); t.oncomplete=()=>ok(); t.onerror=()=>mal(t.error); }); },
  async idbGet(k){ const d=await this.db(); return new Promise((ok,mal)=>{ const r=d.transaction('llaves','readonly').objectStore('llaves').get(k); r.onsuccess=()=>ok(r.result); r.onerror=()=>mal(r.error); }); },
  async idbDel(k){ try{ const d=await this.db(); await new Promise(ok=>{ const t=d.transaction('llaves','readwrite'); t.objectStore('llaves').delete(k); t.oncomplete=ok; t.onerror=ok; }); }catch(e){} },
  async bioDisponible(){ try{ return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }catch(e){ return false; } },
  uvOk(authData){ const a=new Uint8Array(authData); return a.length>32 && (a[32] & 0x04)!==0; },
};
const BIO = /iPhone|iPad|Macintosh/.test(navigator.userAgent) ? 'Face ID' : 'huella o rostro';
function intentos(){ return store.get('fin.intentos', {n:0, hasta:0}); }

/* Teclado numérico. modo: 'entrar' | 'crear' | 'confirmar' */
function teclado({titulo, sub, n, alCompletar, conBio, pie}){
  let pin='';
  $('#app').innerHTML = `<div class="lock"><div class="brand"><div class="logo">${ICON.logo}</div><span style="font-size:20px">Mis finanzas</span></div>
    <h2>${titulo}</h2><div class="sub">${sub||''}</div>
    <div class="dots" id="dots"></div><div class="msg" id="lmsg"></div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-d="${d}">${d}</button>`).join('')}
      ${conBio?`<button class="ico" id="kBio" aria-label="Entrar con ${BIO}">${ICON.cara}</button>`:(n?'<span></span>':`<button class="txt" id="kOk">Listo</button>`)}
      <button data-d="0">0</button><button class="ico" id="kDel" aria-label="Borrar">${ICON.borrar}</button></div>
    ${pie||''}</div>`;
  const pintar=()=>{ const total=n||Math.max(4,pin.length); $('#dots').innerHTML=Array.from({length:total},(_,i)=>`<i class="${i<pin.length?'on':''}"></i>`).join(''); };
  const msg=(t,mal)=>{ const m=$('#lmsg'); m.textContent=t||''; m.className='msg'+(mal?' neg':''); };
  const fallo=t=>{ pin=''; pintar(); msg(t,true); const d=$('#dots'); d.classList.remove('mal'); void d.offsetWidth; d.classList.add('mal'); };
  let ocupado=false;
  const enviar=async()=>{ if(ocupado) return; ocupado=true; msg('Verificando…'); try{ await alCompletar(pin, fallo); }finally{ ocupado=false; } };
  const tecla=d=>{ if(ocupado) return; if(d==='del'){ pin=pin.slice(0,-1); msg(''); pintar(); return; }
    if(pin.length>=8) return; pin+=d; msg(''); pintar(); if(n && pin.length===n) enviar(); };
  document.querySelectorAll('.pad [data-d]').forEach(b=>b.onclick=()=>tecla(b.dataset.d));
  $('#kDel').onclick=()=>tecla('del');
  if($('#kOk')) $('#kOk').onclick=()=>{ if(pin.length<4){ fallo('Usa entre 4 y 8 dígitos'); return; } enviar(); };
  document.onkeydown=e=>{ if(!$('.lock')) { document.onkeydown=null; return; }
    if(/^[0-9]$/.test(e.key)) tecla(e.key); else if(e.key==='Backspace') tecla('del'); else if(e.key==='Enter' && $('#kOk')) $('#kOk').click(); };
  pintar();
  return {msg, fallo};
}

function errorBio(e){
  if (e?.name==='NotAllowedError') return `Se canceló o no se pudo usar ${BIO}. Puedes intentarlo de nuevo.`;
  if (e?.name==='InvalidStateError') return `Ya hay una llave guardada para esta página. Intenta de nuevo.`;
  return e?.message || String(e);
}
async function tokenConBio(){
  const b=S.cfg.seg.bio;
  const pk={challenge:SEG.rnd(32), rpId:location.hostname, allowCredentials:[{type:'public-key', id:SEG.deb64u(b.credId)}], userVerification:'required', timeout:60000};
  if (b.modo==='prf') pk.extensions={prf:{eval:{first:SEG.deb64u(b.prfSalt)}}};
  const a = await navigator.credentials.get({publicKey:pk});
  if (SEG.b64u(a.rawId)!==b.credId || !SEG.uvOk(a.response.authenticatorData)) throw new Error(`${BIO} no confirmó tu identidad.`);
  let llave;
  if (b.modo==='prf'){ const sec=a.getClientExtensionResults?.().prf?.results?.first; if(!sec) throw new Error(`${BIO} no entregó la llave. Entra con tu clave.`); llave=await SEG.llavePRF(sec); }
  else { llave=await SEG.idbGet('bio'); if(!llave) throw new Error(`Se perdió la llave de ${BIO} en este teléfono. Entra con tu clave y vuelve a activarlo en Más → Seguridad.`); }
  return SEG.descifrar(llave, b);
}

function vError(t){
  $('#app').innerHTML=`<div class="lock"><div class="brand"><div class="logo">${ICON.logo}</div><span style="font-size:20px">Mis finanzas</span></div>
    <div class="msg neg">${esc(t)}</div><button class="btn" id="bRe">Reintentar</button></div>`;
  $('#bRe').onclick=()=>inicio(false);
}

/* Descarga la app desde el repositorio privado y la abre en esta misma página */
async function abrir(token){
  const c=S.cfg;
  $('#app').innerHTML='<div class="setup"><div class="empty">Cargando tus finanzas…</div></div>';
  let r;
  try{ r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/app/index.html?ref=${c.branch||'main'}&t=${Date.now()}`,
      {cache:'no-store', headers:{'Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28','Accept':'application/vnd.github.raw+json'}}); }
  catch(e){ vError('Sin conexión con GitHub. Revisa tu internet e intenta de nuevo.'); return; }
  if (r.status===401){ vSetup('GitHub rechazó el token guardado (venció o lo revocaste). Pega uno nuevo.'); return; }
  if (!r.ok){ vError(`GitHub respondió ${r.status} al abrir la app. Intenta de nuevo en un momento.`); return; }
  const html=await r.text();
  window.__FIN_T=token; window.__FIN_CFG=c;
  document.open(); document.write(html); document.close();
}

function vBloqueo(auto){
  const seg=S.cfg.seg; const conBio=!!seg.bio;
  const k = teclado({titulo:'Ingresa tu clave', sub: conBio?`O toca la cara para usar ${BIO}.`:'', n:seg.pin.n, conBio,
    pie:`<button class="link" id="kOlvide">¿Olvidaste tu clave?</button>`,
    alCompletar: async (pin, fallo)=>{
      const it=intentos();
      if (it.hasta>Date.now()){ fallo(`Demasiados intentos. Espera ${Math.ceil((it.hasta-Date.now())/1000)} segundos.`); return; }
      let t;
      try{ const llave=await SEG.llavePin(pin, SEG.deb64u(seg.pin.salt)); t=await SEG.descifrar(llave, seg.pin); }
      catch(e){ const n=it.n+1; store.set('fin.intentos', {n, hasta: n>=5 ? Date.now()+30000*(n-4) : 0});
        fallo(n>=5?'Clave incorrecta. Espera 30 segundos.':'Clave incorrecta'); return; }
      store.set('fin.intentos', {n:0, hasta:0}); document.onkeydown=null; abrir(t);
    }});
  const usarBio=async(silencioso)=>{ try{ k.msg(''); const t=await tokenConBio(); store.set('fin.intentos',{n:0,hasta:0}); document.onkeydown=null; abrir(t); }
    catch(e){ if(!silencioso) k.msg(errorBio(e), true); } };
  if ($('#kBio')) $('#kBio').onclick=()=>usarBio(false);
  $('#kOlvide').onclick=async()=>{ if(!confirm('Se borrará el acceso guardado en este teléfono. Para entrar de nuevo tendrás que pegar tu token de GitHub (o crear uno nuevo). ¿Continuar?')) return;
    await SEG.idbDel('bio'); const {owner,repo,branch}=S.cfg; S.cfg={owner,repo,branch}; localStorage.removeItem('fin.cfg'); vSetup(); };
  if (conBio && auto) usarBio(true);
}

function vSetup(err){
  const c=S.cfg||{owner:location.hostname.split('.')[0],repo:'gastos',branch:'main'};
  $('#app').innerHTML=`<div class="setup"><div class="brand" style="margin-bottom:14px"><div class="logo">${ICON.logo}</div><span style="font-size:20px">Mis finanzas</span></div>
  <div class="card"><h2>Conecta tu repositorio</h2><div class="sub">Los datos y la app viven en tu repositorio privado de GitHub. Esta página no guarda nada en ningún servidor: el token queda solo en este dispositivo.</div>
  ${err?`<div class="note neg">${esc(err)}</div>`:''}
  <div class="row2"><div><label class="f">Usuario u organización</label><input class="inp" id="sOwner" value="${esc(c.owner)}" placeholder="tu-usuario"></div>
  <div><label class="f">Repositorio</label><input class="inp" id="sRepo" value="${esc(c.repo)}"></div></div>
  <label class="f">Token de acceso (fine-grained)</label><input class="inp" id="sTok" type="password" value="" placeholder="github_pat_…" autocomplete="off">
  <button class="btn" id="sGo">Entrar</button>
  <ol><li>En GitHub: Settings → Developer settings → Fine-grained tokens → Generate new token.</li><li>Repository access: solo el repositorio de finanzas.</li><li>Permisos: <b>Contents</b> lectura y escritura, <b>Actions</b> lectura y escritura.</li></ol></div></div>`;
  $('#sGo').onclick=()=>{ const t=$('#sTok').value.trim(); if(!t){ toast('Pega tu token'); return; }
    S.cfg={owner:$('#sOwner').value.trim(),repo:$('#sRepo').value.trim(),branch:'main'}; abrir(t); };
}

function aplicarTema(){ const t=store.get('fin.tema','auto'); if(t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t); }

function inicio(auto){
  S.cfg=store.get('fin.cfg', null);
  if (S.cfg?.seg?.pin){ vBloqueo(auto); return; }
  if (S.cfg?.token){ abrir(S.cfg.token); return; }   // instalación anterior con token sin cifrar
  vSetup();
}
aplicarTema();
inicio(true);
})();
</script>
